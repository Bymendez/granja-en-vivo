services:
  - type: web
    name: granja-en-vivo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Un solo proceso: los datos viven en la memoria de ese proceso
    startCommand: gunicorn main:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /salud
    envVars:
      - key: CLAVE_API
        value: granja701n
      - key: PYTHON_VERSION
        value: 3.12.7
